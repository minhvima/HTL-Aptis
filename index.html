let confirmState = null;
function confirmBox(msg) { return window.confirm ? window.confirm(msg) || confirmTwice(msg) : true; }
function confirmTwice(msg) { // confirm() bi chan trong artifact -> dung xac nhan 2 buoc
  if (confirmState === msg) { confirmState = null; return true; }
  confirmState = msg; toast('Bấm lần nữa để xác nhận: ' + msg);
  setTimeout(() => { confirmState = null; }, 5000);
  return false;
}

/* ---- Xuat / nhap toan bo du lieu ---- */
function exportAll() {
  const lib = libList();
  const progress = {};
  lib.forEach(it => { const d = load(it.id, null); if (d) progress[it.id] = d; });
  if (S.id) progress[S.id] = { cards: S.cards, hard: S.hard, stats: S.stats };
  return JSON.stringify({ v: 2, at: new Date().toISOString(), library: lib, progress, prefs: S.prefs, vocab: VOCAB }, null, 1);
}
function importAll(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast('File sao lưu không đọc được.'); return; }
  if (!data || !data.library) { toast('File này không phải bản sao lưu của công cụ.'); return; }
  const cur = libList();
  let added = 0, merged = 0;
  (data.library || []).forEach(it => {
    const inc = (data.progress || {})[it.id];
    const mine = load(it.id, null);
    const incReps = (inc && inc.stats && inc.stats.reviews) || 0;
    const myReps = (mine && mine.stats && mine.stats.reviews) || 0;
    if (inc && incReps >= myReps) save(it.id, inc);
    if (!cur.some(x => x.id === it.id)) { cur.push(it); added++; } else merged++;
  });
  cur.sort((a, b) => (b.at || 0) - (a.at || 0));
  libSave(cur);
  if (data.vocab) {                                  // gop kho tu vung, khong de mat cai da co
    ['known', 'miss', 'taps', 'gloss'].forEach(f => {
      const inc = data.vocab[f] || {};
      Object.keys(inc).forEach(k => {
        if (f === 'miss' || f === 'taps') VOCAB[f][k] = Math.max(VOCAB[f][k] || 0, inc[k]);
        else VOCAB[f][k] = inc[k];
      });
    });
    vocabSave();
  }
  if (S.id) { const d = load(S.id, null); if (d) { S.cards = d.cards || {}; S.hard = d.hard || {}; S.stats = d.stats || S.stats; } }
  toast('Đã nhập: ' + added + ' bài mới, ' + merged + ' bài cập nhật');
  render();
}
function showBackupText(host, data, afterDownload) {
  host.innerHTML = '';
  const ta = el('textarea', 'type');
  ta.style.marginTop = '10px'; ta.style.fontFamily = 'var(--mono)'; ta.style.fontSize = 'calc(12px * var(--zoom))';
  ta.value = data;
  host.appendChild(ta);
  host.appendChild(el('p', 'hint', afterDownload
    ? 'Nếu trình duyệt không tải được file (bản web trên điện thoại luôn như vậy), hãy chép toàn bộ đoạn trên và dán vào ô này ở máy kia rồi bấm “Dán bản sao lưu vào đây”.'
    : 'Chép toàn bộ đoạn trên và dán vào ô “Nhập” ở máy khác (hoặc lưu thành file .json).'));
  const row = el('div', 'row');
  const bPaste = el('button', 'btn sm', 'Dán bản sao lưu vào đây');
  bPaste.onclick = () => { if (ta.value.trim()) importAll(ta.value); };
  row.appendChild(bPaste);
  host.appendChild(row);
  ta.select();
}

/* ---------------- 10. APP ---------------- */
function render() {
  if (S.mode !== 'speak' && ASR.stream) ASR.release();   // roi tab ghi am thi tra micro lai
  renderTabs(); renderRail();
  const v = $('#view'); v.innerHTML = '';
  v.classList.toggle('map', S.mode === 'map');            // so do dung het be ngang
  v.classList.toggle('narrow', S.prefs.width === 'narrow');
  if (!STORAGE_OK) {
    const w = el('div', 'card');
    w.style.borderColor = 'var(--warn)';
    w.appendChild(el('h2', null, 'Trình duyệt đang chặn bộ nhớ cục bộ'));
    w.appendChild(el('p', 'hint', 'Tiến độ sẽ không được lưu khi đóng trang. Hãy mở file bằng Chrome hoặc Edge ở cửa sổ thường (không phải chế độ ẩn danh). Trong lúc đó, dùng “Xuất file sao lưu” ở tab Tiến độ trước khi đóng.'));
    v.appendChild(w);
  }
  if (!S.doc) { viewEmpty(v); return; }
  const fn = { read: viewRead, skeleton: viewSkeleton, map: viewMap, cloze: viewCloze, type: viewType, speak: viewSpeak, srs: viewSrs, stats: viewStats }[S.mode] || viewRead;
  fn(v);
}

function viewEmpty(v) {
  if (libList().length) {
    const lib = el('div', 'card');
    lib.appendChild(el('h2', null, 'Bài đã lưu'));
    lib.appendChild(el('p', 'hint', 'Mỗi file bạn mở đều được giữ lại cùng tiến độ. Bấm để học tiếp, không cần chọn lại file.'));
    renderLibrary(lib, false);
    v.appendChild(lib);
  }
  const c = el('div', 'card');
  c.appendChild(el('h2', null, 'Mở một bài để bắt đầu'));
  c.appendChild(el('p', 'hint', 'Chọn file .txt trong thư mục Input doc (ví dụ Reading/Part 4/19-25.txt). Công cụ tự tách phần chủ đề và phần bài mẫu, chia câu, tạo thẻ học và lịch ôn.'));
  const drop = el('div', 'drop');
  drop.style.marginTop = '14px';
  drop.innerHTML = '<b>Kéo file .txt vào đây</b><div class="hint" style="margin-top:6px">hoặc bấm &ldquo;Mở file .txt&rdquo; ở trên, hoặc dán nội dung bên dưới</div>';
  c.appendChild(drop);
  const row = el('div', 'row'); row.style.marginTop = '12px';
  const b1 = el('button', 'btn primary', 'Mở file .txt');
  b1.onclick = () => $('#fileInput').click();
  const b2 = el('button', 'btn', 'Dán bài mới');
  b2.onclick = openPaste;
  row.appendChild(b1); row.appendChild(b2);
  c.appendChild(row);
  v.appendChild(c);

  const g = el('div', 'card');
  g.appendChild(el('h2', null, 'Lộ trình gợi ý cho 1 bài (khoảng 35 phút)'));
  const ol = el('ol'); ol.style.cssText = 'margin:8px 0 0;padding-left:20px;font-size:calc(16px * var(--zoom));line-height:1.8';
  [
    'Đọc & Nghe 2 lượt, bấm các cụm từ lạ để nắm nghĩa và phát âm (5 phút).',
    'Khung ý: học từ khoá + chữ cái đầu, xếp lại trật tự câu (8 phút).',
    'Xoá dần mức 1 → 2 → 3 (10 phút).',
    'Gõ lại từng câu, đạt mức đúng trên 90% (8 phút).',
    'Đọc lại bằng micro cả đoạn, rồi cả bài (4 phút).',
    'Ngày mai: vào tab Ôn tập, chỉ làm các câu đến hạn.'
  ].forEach(s => ol.appendChild(el('li', null, s)));
  g.appendChild(ol);
  v.appendChild(g);
}

/* ---- Thu vien bai: moi file da mo deu duoc giu lai kem tien do ---- */
function libList() { return load('library', []); }
function libSave(list) { save('library', list.slice(0, 60)); }
function libUpsert(id, name, raw, nSent) {
  const list = libList().filter(x => x.id !== id);
  list.unshift({ id, name, raw, nSent, at: Date.now() });
  libSave(list);
}
function libStats(id) {
  const d = load(id, null);
  if (!d || !d.cards) return { done: 0, reps: 0 };
  const cards = Object.values(d.cards);
  const done = cards.filter(c => c.reps && c.step >= STEPS.length).length;
  return { done, reps: (d.stats && d.stats.reviews) || 0 };
}
function libRemove(id) {
  libSave(libList().filter(x => x.id !== id));
  try { localStorage.removeItem(KEY(id)); } catch (e) {}
}
function renderLibrary(host, compact) {
  const list = libList();
  if (!list.length) { host.appendChild(el('p', 'hint', 'Chưa có bài nào được lưu. Mở một file .txt để bắt đầu.')); return; }
  const box = el('div', 'lib');
  list.forEach(it => {
    const row = el('div', 'libitem' + (it.id === S.id ? ' cur' : ''));
    const open = el('button', 'nm', it.name);
    open.style.cssText = 'border:0;background:transparent;text-align:left;padding:0';
    open.onclick = () => loadText(it.raw, it.name);
    row.appendChild(open);
    const st = libStats(it.id);
    row.appendChild(el('span', 'mt', st.done + '/' + (it.nSent || '?') + ' câu vững · ' + st.reps + ' lần ôn'));
    if (!compact) {
      const del = el('button', 'del', 'Xoá');
      del.title = 'Xoá bài này và tiến độ của nó';
      del.onclick = ev => {
        ev.stopPropagation();
        if (!confirmBox('Xoá “' + it.name + '” cùng toàn bộ tiến độ?')) return;
        libRemove(it.id);
        if (it.id === S.id) { S.doc = null; S.id = null; $('#fileChip').hidden = true; }
        render();
      };
      row.appendChild(del);
    }
    box.appendChild(row);
  });
  host.appendChild(box);
}

function loadText(raw, name) {
  const doc = parseDoc(raw);
  if (!doc.paras.length) { toast('Không tìm thấy đoạn tiếng Anh nào trong file.'); return; }
  S.doc = doc; S.name = name;
  S.id = 'doc:' + hash(doc.body);
  const saved = load(S.id, null);
  S.cards = (saved && saved.cards) || {};
  S.hard = (saved && saved.hard) || {};
  S.stats = (saved && saved.stats) || { sessions: 0, reviews: 0, lastDay: '', streak: 0, bestWhole: 0 };
  S.stats.sessions = (S.stats.sessions || 0) + 1;
  S.sel = -1; S.drillI = 0; S.spI = 0; S.cue = null; S.clozeLv = 1;
  S.mode = S.prefs.phase === 'verbatim' ? 'cloze' : 'read';
  const nSent = allSentIds().length;
  $('#fileChip').hidden = false;
  $('#fileName').textContent = name;
  $('#fileMeta').textContent = doc.paras.length + ' đoạn · ' + nSent + ' câu · ' + words(doc.body).length + ' từ';
  save('last', S.id);
  libUpsert(S.id, name, raw, nSent);
  persist(); render();
  const old = saved ? ' (tiến độ cũ đã được khôi phục)' : '';
  toast('Đã nạp: ' + nSent + ' câu, ' + dueIds().length + ' câu cần học' + old);
}

/* ---- Hop thoai dan bai moi: goi duoc moi luc, co o nhap ten bai ---- */
function autoName(raw) {
  const d = parseDoc(raw);
  if (d.topics.length) return d.topics[0].title.replace(/^Topic\s*/i, 'Topic ').slice(0, 60);
  const w = words(d.body).slice(0, 6).join(' ');
  return w ? w + '…' : 'Bài không tên';
}
function openPaste() {
  closePop();
  const ov = el('div', 'overlay');
  const box = el('div', 'modal');
  box.appendChild(el('h2', null, 'Dán bài mới'));
  box.appendChild(el('p', 'hint', 'Dán nguyên văn bài vào ô nội dung. Nếu có phần chủ đề, đặt ở trên và ngăn bằng một dòng gạch ngang (ví dụ ------). Mỗi đoạn văn để trên một dòng.'));

  const lName = el('label', 'field');
  lName.appendChild(el('span', null, 'Tên bài'));
  const iName = el('input');
  iName.placeholder = 'Ví dụ: Topic 11-18 Reading part 4 — để trống sẽ tự đặt theo chủ đề đầu tiên';
  lName.appendChild(iName);
  box.appendChild(lName);

  const lBody = el('label', 'field');
  lBody.appendChild(el('span', null, 'Nội dung bài'));
  const ta = el('textarea');
  ta.placeholder = 'Topic 11: Describe a time when…\n------------------------------\nA few months ago, I went on a long hiking trip…\n\nAt the beginning of the trip, we were excited…';
  lBody.appendChild(ta);
  box.appendChild(lBody);

  const info = el('p', 'hint'); info.style.marginTop = '8px';
  const preview = () => {
    const t = ta.value.trim();
    if (t.length < 40) { info.textContent = ''; return; }
    const d = parseDoc(t);
    info.textContent = 'Sẽ tạo: ' + d.topics.length + ' chủ đề · ' + d.paras.length + ' đoạn · '
      + d.paras.reduce((a, p) => a + p.sentences.length, 0) + ' câu · ' + words(d.body).length + ' từ';
  };
  ta.oninput = preview;
  box.appendChild(info);

  const row = el('div', 'row'); row.style.marginTop = '14px';
  const bOk = el('button', 'btn primary', 'Nạp bài');
  const bCancel = el('button', 'btn ghost', 'Huỷ');
  row.appendChild(bOk); row.appendChild(bCancel);
  row.appendChild(el('span', 'hint', 'Ctrl+Enter để nạp'));
  box.appendChild(row);

  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const submit = () => {
    const raw = ta.value.trim();
    if (raw.length < 40) { toast('Nội dung quá ngắn.'); ta.focus(); return; }
    const name = iName.value.trim() || autoName(raw);
    close();
    loadText(raw, name);
  };
  bOk.onclick = submit;
  bCancel.onclick = close;
  const onKey = e => {
    if (e.key === 'Escape') close();
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); }
  };
  document.addEventListener('keydown', onKey);
  ov.onclick = e => { if (e.target === ov) close(); };
  ov.appendChild(box);
  document.body.appendChild(ov);
  setTimeout(() => ta.focus(), 30);
}

function readFile(f) {
  const r = new FileReader();
  r.onload = () => loadText(String(r.result), f.name.replace(/\.txt$/i, ''));
  r.readAsText(f, 'utf-8');
}

$('#openBtn').onclick = () => $('#fileInput').click();
$('#pasteBtn').onclick = openPaste;
$('#fileInput').onchange = e => { const f = e.target.files[0]; if (f) readFile(f); };
$('#railBtn').onclick = () => $('#rail').classList.toggle('open');
function applyWidthBtn() {
  const b = $('#widthBtn'); if (!b) return;
  const narrow = S.prefs.width === 'narrow';
  b.textContent = narrow ? 'Khổ hẹp' : 'Khổ rộng';
  b.setAttribute('aria-pressed', String(!narrow));
}
$('#widthBtn').onclick = () => {
  S.prefs.width = S.prefs.width === 'narrow' ? 'wide' : 'narrow';
  persist(); applyWidthBtn(); render();
};
applyWidthBtn();

$('#themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const nx = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
  if (nx) document.documentElement.setAttribute('data-theme', nx); else document.documentElement.removeAttribute('data-theme');
  S.prefs.theme = nx; persist();
};
if (S.prefs.theme) document.documentElement.setAttribute('data-theme', S.prefs.theme);

['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); const d = $('.drop'); if (d) d.classList.add('hot');
}));
document.addEventListener('dragleave', () => { const d = $('.drop'); if (d) d.classList.remove('hot'); });
document.addEventListener('drop', e => {
  e.preventDefault(); const d = $('.drop'); if (d) d.classList.remove('hot');
  const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) readFile(f);
});
document.addEventListener('keydown', e => {
  if (e.altKey && e.key.toLowerCase() === 'p') { e.preventDefault(); TTS.say(selText()); }
  if (e.altKey && e.key.toLowerCase() === 's') { e.preventDefault(); TTS.stop(); }
});

/* chinh co chu */
function applyZoom() {
  const z = clamp(S.prefs.zoom || 1, 0.8, 1.8);
  S.prefs.zoom = z;
  document.documentElement.style.setProperty('--zoom', String(z));
  const lbl = $('#zoomVal'); if (lbl) lbl.textContent = Math.round(z * 100) + '%';
}
$('#zoomIn').onclick = () => { S.prefs.zoom = clamp((S.prefs.zoom || 1) + 0.1, 0.8, 1.8); applyZoom(); persist(); if (S.mode === 'map') render(); };
$('#zoomOut').onclick = () => { S.prefs.zoom = clamp((S.prefs.zoom || 1) - 0.1, 0.8, 1.8); applyZoom(); persist(); if (S.mode === 'map') render(); };
applyZoom();

TTS.init();
const lastId = load('last', null);
const lastEntry = typeof lastId === 'string' ? libList().find(x => x.id === lastId) : (lastId && lastId.raw ? lastId : null);
if (lastEntry && lastEntry.raw) loadText(lastEntry.raw, lastEntry.name); else render();
</script>
