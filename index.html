<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memorization support - Aptis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky toolbar + mode tabs + left rail (bai & tien do) + one scrolling practice panel */
:root{
  --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eceee9; --line:#d8ddd6;
  --fg:#1b241f; --fg-dim:#5d6a62; --fg-faint:#8b968e;
  --accent:#0e6f60; --accent-ink:#0a5547; --accent-soft:#dbeee9;
  --marker:#f3c948; --marker-soft:#fdf2cf;
  --good:#2b7a4b; --warn:#a96a10; --bad:#b53b2c;
  --good-soft:#dcefe2; --bad-soft:#fae1dd;
  --radius:10px; --zoom:1;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --ui:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13181a; --surface:#1b2225; --surface-2:#232c30; --line:#333e42;
  --fg:#e7ece9; --fg-dim:#a5b2ac; --fg-faint:#78857e;
  --accent:#49c0aa; --accent-ink:#8fe0cf; --accent-soft:#1e3a36;
  --marker:#e8c15a; --marker-soft:#3a3320;
  --good:#5fc189; --warn:#dca94a; --bad:#e8796a;
  --good-soft:#1e3528; --bad-soft:#3a2420;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13181a; --surface:#1b2225; --surface-2:#232c30; --line:#333e42;
  --fg:#e7ece9; --fg-dim:#a5b2ac; --fg-faint:#78857e;
  --accent:#49c0aa; --accent-ink:#8fe0cf; --accent-soft:#1e3a36;
  --marker:#e8c15a; --marker-soft:#3a3320;
  --good:#5fc189; --warn:#dca94a; --bad:#e8796a;
  --good-soft:#1e3528; --bad-soft:#3a2420;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:calc(17.3px * var(--zoom));line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

/* shell */
.app{display:flex;flex-direction:column;height:100%}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:calc(21.8px * var(--zoom));font-weight:600;letter-spacing:-.01em;white-space:nowrap;line-height:1.3;padding:2px 0}
.brand small{display:block;font-family:var(--ui);font-size:calc(12.1px * var(--zoom));font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-faint)}
.bar-spacer{flex:1 1 auto;min-width:0}
.tagline{display:flex;flex-direction:column;gap:1px;min-width:0;max-width:min(49em, 56vw);padding:6px 12px;
  border:1px solid var(--line);border-left:3px solid var(--marker);border-radius:8px;
  background:var(--surface-2);font-size:calc(12.8px * var(--zoom));line-height:1.4;color:var(--fg-dim)}
.tagline b{color:var(--fg);font-weight:600}
.tagline .nb{white-space:nowrap}   /* tên người và tên trường không bị cắt giữa chừng */
@media (max-width:720px){.tagline{display:none}}
.filechip{display:flex;align-items:center;gap:8px;min-width:0;max-width:46vw;padding:5px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;font-size:calc(14.4px * var(--zoom));color:var(--fg-dim)}
.filechip b{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:calc(15.5px * var(--zoom));font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:calc(13.8px * var(--zoom))}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.tabs{flex:0 0 auto;display:flex;align-items:center;gap:4px;overflow-x:auto;overflow-y:hidden;padding:8px 16px;min-height:calc(50px * var(--zoom));background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{flex:0 0 auto;padding:7px 13px;border:1px solid transparent;border-radius:999px;background:transparent;font-size:calc(15.5px * var(--zoom));font-weight:600;color:var(--fg-dim);white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--fg)}
.tab .cnt{display:inline-block;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:calc(12.6px * var(--zoom));font-variant-numeric:tabular-nums}

.body{flex:1 1 auto;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:0}
.rail{border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 40px;background:var(--surface)}
.main{overflow-y:auto;padding:18px 20px 64px;min-width:0}
.wrap{max-width:1240px;margin:0 auto}      /* khổ rộng: mặc định */
.wrap.narrow{max-width:800px}              /* khổ hẹp: dễ đọc văn xuôi hơn */
.wrap.map{max-width:1680px}                /* sơ đồ: rộng hết mức */
@media (max-width:860px){
  .body{grid-template-columns:1fr}
  .rail{display:none;border-right:0;border-bottom:1px solid var(--line);max-height:42vh}
  .rail.open{display:block}
  .main{padding:16px}
}
@media (min-width:861px){.railtoggle{display:none}}

/* rail */
.rail h3{font-size:calc(12.1px * var(--zoom));font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint);margin:14px 2px 7px}
.rail h3:first-child{margin-top:0}
.topic{padding:7px 9px;border-radius:8px;font-size:calc(15px * var(--zoom));color:var(--fg-dim);border-left:3px solid var(--line);margin-bottom:4px}
.topic b{display:block;color:var(--fg);font-weight:600}
.topic .alt{font-size:calc(13.2px * var(--zoom));font-style:italic;color:var(--fg-faint)}
.plist{display:flex;flex-direction:column;gap:3px}
.pitem{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border:0;border-radius:8px;background:transparent;text-align:left;font-size:calc(15px * var(--zoom));color:var(--fg-dim)}
.pitem:hover{background:var(--surface-2);color:var(--fg)}
.pitem[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.pitem .n{font-family:var(--mono);font-size:calc(12.6px * var(--zoom));color:var(--fg-faint)}
.dots{display:flex;gap:2px;margin-left:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.s1{background:var(--bad)}.dot.s2{background:var(--warn)}.dot.s3{background:var(--good)}
.meter{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.railstat{display:flex;justify-content:space-between;font-size:calc(13.8px * var(--zoom));color:var(--fg-dim);margin:0 2px 6px}
.railstat b{font-variant-numeric:tabular-nums;color:var(--fg)}

/* cards & text */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
.card h2{font-family:var(--display);font-size:calc(23px * var(--zoom));font-weight:600;margin-bottom:4px}
.hint{font-size:calc(14.4px * var(--zoom));color:var(--fg-dim)}
.hint.sci{border-left:3px solid var(--marker);padding-left:10px;margin:8px 0 0}
.passage{font-family:var(--display);font-size:calc(20.7px * var(--zoom));line-height:1.75}
.sent{border-radius:4px}
.sent.on{background:var(--marker-soft)}
.sent.dim{color:var(--fg-faint)}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:var(--accent-soft)}
.w.gl{border-bottom:2px solid var(--marker)}                    /* khó & đã có nghĩa */
.w.auto{border-bottom:2px dashed var(--fg-faint)}               /* máy đoán khó, chưa có nghĩa */
.w.hard{background:var(--marker-soft);border-bottom:2px solid var(--warn)}  /* bạn tự đánh dấu */
.blank{display:inline-block;min-width:3.2em;padding:0 4px;margin:0 1px;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:3px;font-family:var(--mono);font-size:.86em;color:var(--accent-ink);text-align:center;cursor:pointer}
.blank.open{background:var(--marker-soft);border-color:var(--marker);color:var(--fg)}
.cue{font-family:var(--mono);font-size:calc(17.3px * var(--zoom));letter-spacing:.06em;color:var(--fg-dim);line-height:2}
.kw{display:inline-block;margin:0 3px 5px 0;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:calc(15px * var(--zoom));font-weight:600}
textarea.type{width:100%;min-height:92px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-family:var(--display);font-size:calc(19.5px * var(--zoom));line-height:1.6;resize:vertical}
.diff{font-family:var(--display);font-size:calc(19.5px * var(--zoom));line-height:1.8;margin-top:10px}
.miss{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;border-radius:3px;padding:0 2px}
.extra{background:var(--marker-soft);color:var(--warn);border-radius:3px;padding:0 2px}
.score{display:flex;align-items:baseline;gap:10px;margin:10px 0 2px}
.score b{font-family:var(--display);font-size:calc(34.5px * var(--zoom));font-variant-numeric:tabular-nums;line-height:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grades{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.grade{flex:1 1 0;min-width:96px;padding:9px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:calc(14.4px * var(--zoom));font-weight:600;text-align:center;line-height:1.3}
.grade span{display:block;font-size:calc(12.1px * var(--zoom));font-weight:500;color:var(--fg-faint)}
.grade.g1:hover{border-color:var(--bad);color:var(--bad)}
.grade.g3:hover{border-color:var(--warn);color:var(--warn)}
.grade.g4:hover,.grade.g5:hover{border-color:var(--good);color:var(--good)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.tile{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.tile b{display:block;font-family:var(--display);font-size:calc(29.9px * var(--zoom));font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:calc(13.2px * var(--zoom));color:var(--fg-dim)}
.scramble{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.sc{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-family:var(--display);font-size:calc(18.4px * var(--zoom));cursor:grab}
.sc.dragging{opacity:.4}
.sc.right{border-color:var(--good);background:var(--good-soft)}
.sc.wrong{border-color:var(--bad);background:var(--bad-soft)}
.sc .h{font-family:var(--mono);font-size:calc(13.8px * var(--zoom));color:var(--fg-faint);padding-top:3px}
.empty{text-align:center;padding:40px 18px}
.empty .big{font-family:var(--display);font-size:calc(27.6px * var(--zoom));margin-bottom:6px}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:28px 18px;text-align:center;color:var(--fg-dim);background:var(--surface)}
.drop.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.pop{position:fixed;z-index:60;width:290px;max-width:calc(100vw - 24px);padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.pop .hw{font-family:var(--display);font-size:calc(21.8px * var(--zoom));font-weight:600}
.pop .ip{font-family:var(--mono);font-size:calc(14.4px * var(--zoom));color:var(--accent);margin-top:1px}
.pop .vi{margin-top:7px;font-size:calc(16.1px * var(--zoom))}
.pop .df{margin-top:6px;font-size:calc(14.4px * var(--zoom));color:var(--fg-dim)}
.pop .nt{margin-top:6px;font-size:calc(13.8px * var(--zoom));color:var(--warn)}
.pop input{width:100%;margin-top:8px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-size:calc(15px * var(--zoom))}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;padding:9px 16px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:calc(15px * var(--zoom));font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.srsline{font-size:calc(13.8px * var(--zoom));color:var(--fg-faint);font-family:var(--mono)}
.rec{display:inline-flex;align-items:center;gap:7px}
.rec .led{width:9px;height:9px;border-radius:50%;background:var(--line)}
.rec.live .led{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
label.sw{display:inline-flex;align-items:center;gap:6px;font-size:calc(14.4px * var(--zoom));color:var(--fg-dim)}
.sel{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);font-size:calc(14.4px * var(--zoom))}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
.kbd{font-family:var(--mono);font-size:calc(12.6px * var(--zoom));padding:1px 5px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2);color:var(--fg-dim)}
.wordlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.overlay{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,20,16,.5)}
.modal{width:min(760px,100%);max-height:86vh;overflow:auto;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 18px 48px rgba(0,0,0,.28)}
.modal h2{font-family:var(--display);font-size:calc(23px * var(--zoom));font-weight:600}
.field{display:block;margin-top:12px}
.field span{display:block;margin-bottom:4px;font-size:calc(13px * var(--zoom));font-weight:600;color:var(--fg-dim)}
.field input,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:calc(15px * var(--zoom))}
.field textarea{min-height:230px;font-family:var(--display);font-size:calc(16.5px * var(--zoom));line-height:1.6;resize:vertical}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:calc(13px * var(--zoom));color:var(--fg-dim)}
.legend i{font-style:normal}
.zoombox{display:inline-flex;align-items:center;gap:5px}
.zoombox b{font-size:calc(12.5px * var(--zoom));font-variant-numeric:tabular-nums;color:var(--fg-dim);min-width:3.4em;text-align:center}
/* thu vien bai da hoc */
.lib{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.libitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);text-align:left;width:100%}
.libitem:hover{border-color:var(--accent)}
.libitem.cur{border-color:var(--accent);background:var(--accent-soft)}
.libitem .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libitem .mt{font-size:calc(13px * var(--zoom));color:var(--fg-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.libitem .del{padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;font-size:calc(12px * var(--zoom));color:var(--fg-faint)}
.libitem .del:hover{border-color:var(--bad);color:var(--bad)}
/* so do mindmap */
.mapwrap{overflow-x:auto;overflow-y:hidden;padding-bottom:6px}
.mapwrap svg{display:block}
.mapnode{cursor:pointer}
.mapnode rect{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5}
.mapnode.root rect{fill:var(--accent);stroke:var(--accent)}
.mapnode.root text{fill:#fff;font-weight:700}
.mapnode.branch rect{fill:var(--accent-soft);stroke:var(--accent)}
.mapnode.branch text{fill:var(--accent-ink);font-weight:600}
.mapnode text{fill:var(--fg);font-family:var(--ui)}
.mapnode:hover rect{stroke:var(--marker);stroke-width:2.5}
.mapnode.m3 rect{stroke:var(--good)}
.mapnode.m1 rect{stroke-dasharray:4 3}
.maplink{fill:none;stroke:var(--line);stroke-width:1.8}
.mapcap{font-family:var(--mono);fill:var(--fg-faint)}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">Memorization support - Aptis<small>Speaking &middot; Part 4</small></div>
    <button class="btn sm ghost railtoggle" id="railBtn">Bài &amp; tiến độ</button>
    <div class="tagline">
      <span>Công cụ hỗ trợ học thuộc lòng bài viết tiếng Anh ngắn.</span>
      <span>Sản phẩm tự phát triển cho riêng nhu cầu cá nhân của <b class="nb">Phạm Trung Minh</b> <span class="nb">&ndash; ĐH Hàng Hải Việt Nam</span></span>
    </div>
    <div class="bar-spacer"></div>
    <div class="filechip" id="fileChip" hidden><span>Bài:</span><b id="fileName"></b><span id="fileMeta"></span></div>
    <button class="btn" id="openBtn">Mở file .txt</button>
    <button class="btn" id="pasteBtn">Dán bài mới</button>
    <span class="zoombox">
      <button class="btn ghost sm" id="zoomOut" title="Thu nhỏ chữ">A&minus;</button>
      <b id="zoomVal">100%</b>
      <button class="btn ghost sm" id="zoomIn" title="Phóng to chữ">A+</button>
    </span>
    <button class="btn ghost sm" id="widthBtn" title="Đổi bề ngang khung nội dung">Khổ rộng</button>
    <button class="btn ghost sm" id="themeBtn" title="Đổi nền sáng / tối">Sáng / Tối</button>
    <input type="file" id="fileInput" accept=".txt,text/plain" hidden>
  </header>

  <nav class="tabs" id="tabs" role="tablist" hidden></nav>

  <div class="body">
    <aside class="rail" id="rail"></aside>
    <main class="main"><div class="wrap" id="view"></div></main>
  </div>
</div>

<script>
/* glossary.js được nhúng sẵn */
/* Từ điển tra nhanh cho Aptis Memorizer.
   Mở rộng tự do: thêm entry dạng "cụm từ": { vi, ipa, note }
   Khoá viết thường. Cụm nhiều từ sẽ được tự động highlight trong bài. */
window.APTIS_GLOSSARY = {
  /* --- Bài 19-25: hiking trip --- */
  "hiking trip": { vi: "chuyến đi bộ đường dài", ipa: "/ˈhaɪkɪŋ trɪp/" },
  "remote": { vi: "xa xôi, hẻo lánh", ipa: "/rɪˈməʊt/" },
  "unforgettable": { vi: "không thể nào quên", ipa: "/ˌʌnfəˈɡetəbl/" },
  "unexpected": { vi: "bất ngờ, ngoài dự tính", ipa: "/ˌʌnɪkˈspektɪd/" },
  "challenges": { vi: "những thử thách", ipa: "/ˈtʃælɪndʒɪz/" },
  "kind stranger": { vi: "một người lạ tử tế", ipa: "/kaɪnd ˈstreɪndʒə/" },
  "took part in": { vi: "đã tham gia vào", ipa: "/tʊk pɑːt ɪn/", note: "take part in = participate in" },
  "take part in": { vi: "tham gia vào", ipa: "/teɪk pɑːt ɪn/" },
  "explore": { vi: "khám phá", ipa: "/ɪkˈsplɔː/" },
  "trail": { vi: "đường mòn", ipa: "/treɪl/" },
  "surrounded by": { vi: "được bao quanh bởi", ipa: "/səˈraʊndɪd baɪ/" },

<script>
/* =======================================================================
   APTIS RECALL TRAINER
   Phuong phap: chunking -> dual coding (doc + nghe + noi) -> active recall
   -> expanding retrieval practice (spacing 1m/6m/20m roi 1d/3d/7d/16d)
   -> method of vanishing cues (xoa dan goi y) -> generation effect.
   ======================================================================= */
'use strict';

const GLOSS = window.APTIS_GLOSSARY || {};
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const MIN = 60000, DAY = 86400000;

/* ---------------- 1. PARSER ---------------- */
const SEP = /^\s*[-_=*~]{4,}\s*$/;                 // dong ngan cach giua phan chu de va bai
const NOTEXT = /^[\s\-_=*~.·•+#|]*$/;              // dong khong co chu nao -> bo qua

function parseDoc(raw) {
  const text = raw.replace(/\r/g, '').replace(/ /g, ' ');
  const lines = text.split('\n');
  let cut = -1;
  for (let i = 0; i < lines.length; i++) if (SEP.test(lines[i])) { cut = i; break; }
  const topLines = cut >= 0 ? lines.slice(0, cut) : [];
  const bodyLines = cut >= 0 ? lines.slice(cut + 1) : lines;

  const topics = [];
  topLines.forEach(l => {
    const s = l.replace(/^[•\*\-●]\s*/, '').trim();
    if (!s) return;
    if (/^\(/.test(s) && topics.length) { topics[topics.length - 1].alt.push(s.replace(/^\(|\)$/g, '').trim()); return; }
    topics.push({ title: s, alt: [] });
  });

  const paras = bodyLines.map(l => l.trim()).filter(l => l && !NOTEXT.test(l)).map((p, i) => ({
    i, text: p, sentences: splitSentences(p).map((t, j) => ({ t, j }))
  }));
  return { topics, paras, body: paras.map(p => p.text).join('\n\n') };
}

function splitSentences(p) {
  const out = [];
  const re = /[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g;
  let m;
  while ((m = re.exec(p))) { const s = m[0].trim(); if (s) out.push(s); }
  // gop cau qua ngan (vi du viet tat) vao cau truoc
  const merged = [];
  out.forEach(s => {
    const prev = merged[merged.length - 1];
    if (prev && (words(s).length < 3 || /\b(Mr|Mrs|Dr|e\.g|i\.e|etc)\.$/.test(prev))) merged[merged.length - 1] = prev + ' ' + s;
    else merged.push(s);
  });
  return merged;
}

const words = s => s.match(/[A-Za-zÀ-ɏ'’-]+/g) || [];
const norm = s => s.toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim();

const STOP = new Set(('a an the and or but so because of to in on at for with by from as it its is was were be been being am are do does did have has had i me my we our you your he she they them his her their this that these those there here not no very more most much many some any all every then than too also just only out up off over under again onto into about after before during while when where which who whom what how if will would can could shall should may might must us').split(' '));

function keywords(s, n) {
  const seen = new Set();
  const list = [];
  words(s).forEach((w, i) => {
    const l = w.toLowerCase();
    if (STOP.has(l) || l.length < 4 || seen.has(l)) return;
    seen.add(l); list.push({ w, i });
  });
  // chon tu "nang" nhat, nhung tra ve dung thu tu xuat hien trong cau
  return list.slice().sort((a, b) => b.w.length - a.w.length).slice(0, n || 4)
    .sort((a, b) => a.i - b.i).map(x => x.w);
}

function firstLetterCue(s) {
  return s.replace(/[A-Za-zÀ-ɏ'’-]+/g, w => w[0] + '·'.repeat(Math.min(w.length - 1, 6)));
}

/* ---------------- 2. STATE / STORAGE ---------------- */
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
const KEY = k => 'aptis-recall:' + k;
const STORAGE_OK = (() => {
  try { localStorage.setItem('aptis-recall:test', '1'); localStorage.removeItem('aptis-recall:test'); return true; }
  catch (e) { return false; }
})();
function load(k, dflt) { try { const v = localStorage.getItem(KEY(k)); return v ? JSON.parse(v) : dflt; } catch (e) { return dflt; } }
function save(k, v) { try { localStorage.setItem(KEY(k), JSON.stringify(v)); } catch (e) {} }

const S = {
  doc: null, id: null, name: '', mode: 'read',
  sel: 0,            // doan dang chon (-1 = ca bai)
  cards: {},         // id -> {ef, iv, step, due, reps, lapses, best}
  hard: {},          // tu kho: word -> {vi}
  stats: { sessions: 0, reviews: 0, lastDay: '', streak: 0, bestWhole: 0 },
  prefs: load('prefs', { rate: 0.95, voice: '', theme: '', phase: 'skeleton', autoplay: false })
};

function persist() { if (S.id) save(S.id, { cards: S.cards, hard: S.hard, stats: S.stats }); save('prefs', S.prefs); }
function cardOf(id) {
  if (!S.cards[id]) S.cards[id] = { ef: 2.5, iv: 0, step: 0, due: 0, reps: 0, lapses: 0, best: 0 };
  return S.cards[id];
}

/* ---------------- 3. SRS: learning steps + SM-2 ---------------- */
const STEPS = [1 * MIN, 6 * MIN, 20 * MIN];          // nen trong 1 buoi hoc
const GRAD = [1, 3, 7, 16, 35];                        // ngay sau khi tot nghiep

function schedule(id, q) {               // q: 1 quen han, 3 kho, 4 on, 5 de
  const c = cardOf(id), now = Date.now();
  c.reps++;
  if (q <= 1) {
    c.lapses++; c.step = 0; c.iv = 0; c.ef = clamp(c.ef - 0.2, 1.3, 2.8);
    c.due = now + STEPS[0];
  } else if (c.step < STEPS.length) {                   // dang trong giai doan hoc
    if (q >= 4) c.step++; else c.due = now + STEPS[c.step];
    c.due = c.step < STEPS.length ? now + STEPS[c.step] : now + GRAD[0] * DAY;
    if (c.step >= STEPS.length) c.iv = GRAD[0];
  } else {                                              // da tot nghiep -> SM-2
    c.ef = clamp(c.ef + (0.1 - (5 - q) * 0.08), 1.3, 2.8);
    const gi = GRAD.indexOf(c.iv);
    c.iv = c.iv ? Math.max(Math.round(c.iv * c.ef), (gi >= 0 ? GRAD[Math.min(gi + 1, GRAD.length - 1)] : c.iv + 1)) : GRAD[0];
    if (q === 3) c.iv = Math.max(1, Math.round(c.iv * 0.6));
    c.due = now + c.iv * DAY;
  }
  S.stats.reviews++;
  const today = new Date().toISOString().slice(0, 10);
  if (S.stats.lastDay !== today) {
    const y = new Date(Date.now() - DAY).toISOString().slice(0, 10);
    S.stats.streak = S.stats.lastDay === y ? S.stats.streak + 1 : 1;
    S.stats.lastDay = today;
  }
  persist();
}
const isDue = id => { const c = S.cards[id]; return !c || c.due <= Date.now(); };
function mastery(id) {                  // 0 chua hoc, 1 moi, 2 dang nho, 3 vung
  const c = S.cards[id]; if (!c || !c.reps) return 0;
  if (c.step < STEPS.length) return 1;
  return c.iv >= GRAD[2] ? 3 : 2;
}
function sentIds(pi) {
  const p = S.doc.paras[pi]; return p ? p.sentences.map(s => 's' + pi + '.' + s.j) : [];
}
function allSentIds() { return S.doc.paras.flatMap((p, i) => sentIds(i)); }
function dueIds() { return allSentIds().filter(isDue); }

/* ---------------- 4. DIFF (word-level LCS) ---------------- */
function tokens(s) { return norm(s).split(' ').filter(Boolean); }
function diffWords(target, said) {
  const A = tokens(target), B = tokens(said);
  const n = A.length, m = B.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0, hit = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { out.push({ k: 'ok', w: A[i] }); hit++; i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ k: 'miss', w: A[i] }); i++; }
    else { out.push({ k: 'extra', w: B[j] }); j++; }
  }
  while (i < n) { out.push({ k: 'miss', w: A[i++] }); }
  while (j < m) { out.push({ k: 'extra', w: B[j++] }); }
  return { parts: out, acc: n ? hit / n : 0, extra: out.filter(p => p.k === 'extra').length };
}
function renderDiff(d) {
  const wrap = el('div');
  const box = el('div', 'diff');
  d.parts.forEach(p => { box.appendChild(el('span', p.k === 'ok' ? '' : p.k, p.w)); box.appendChild(document.createTextNode(' ')); });
  wrap.appendChild(box);
  const lg = el('div', 'legend');
  const item = (cls, txt) => { const s = el('span'); s.appendChild(el('span', cls, cls === 'miss' ? 'từ' : 'từ')); s.appendChild(el('i', null, ' ' + txt)); return s; };
  lg.appendChild(el('span', null, 'Chữ đen: đọc đúng.'));
  lg.appendChild(item('miss', '(gạch đỏ): có trong bản gốc nhưng bạn chưa đọc.'));
  lg.appendChild(item('extra', '(nền vàng): bạn đọc thừa hoặc đọc sai thành từ này.'));
  lg.appendChild(el('span', null, 'Một cặp đỏ + vàng cạnh nhau là một từ bị đọc sai.'));
  wrap.appendChild(lg);
  return wrap;
}
const q4 = acc => acc >= 0.97 ? 5 : acc >= 0.88 ? 4 : acc >= 0.7 ? 3 : 1;

/* ---------------- 5. TTS ---------------- */
const TTS = {
  ok: 'speechSynthesis' in window, voices: [], v: null,
  init() {
    if (!this.ok) return;
    const pick = () => {
      this.voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
      this.v = this.voices.find(v => v.name === S.prefs.voice) || this.voices.find(v => /en-GB/i.test(v.lang)) || this.voices[0] || null;
    };
    pick(); speechSynthesis.onvoiceschanged = pick;
  },
  stop() { if (this.ok) speechSynthesis.cancel(); },
  say(text, opts) {
    if (!this.ok) return null;
    const o = opts || {};
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (this.v) u.voice = this.v;
    u.rate = o.rate || S.prefs.rate; u.lang = (this.v && this.v.lang) || 'en-GB';
    if (o.onend) u.onend = o.onend;
    speechSynthesis.speak(u); return u;
  },
  queue(list, onEach, onDone) {
    if (!this.ok || !list.length) { onDone && onDone(); return; }
    let i = 0; const next = () => {
      if (i >= list.length) { onDone && onDone(); return; }
      onEach && onEach(i);
      this.say(list[i], { onend: () => { i++; setTimeout(next, 220); } });
    }; next();
  }
};

const HARD_PAT = [/ough/, /augh/, /tion\b/, /sion\b/, /ture\b/, /cial\b/, /tial\b/, /eigh/, /^(kn|wr|gn|ps|rh)/, /mb\b/, /que\b/, /sch/, /squ/, /[bcdfgklmnpstv]{3}/, /ous\b/, /ism\b/, /ity\b/];

function syllables(w) {
  const s = w.toLowerCase().replace(/[^a-z]/g, '');
  if (s.length <= 3) return 1;
  const core = s.replace(/(?:[^laeiouy]es|[^laeiouy]e)$/, '').replace(/^y/, '');
  const m = core.match(/[aeiouy]{1,2}/g);
  return Math.max(1, m ? m.length : 1);
}

/* kho tu vung ca nhan, dung chung cho moi bai */
const VOCAB = load('vocab', { known: {}, miss: {}, taps: {}, gloss: {} });
function vocabSave() { save('vocab', VOCAB); }
const vkey = w => w.toLowerCase().replace(/[^a-z' ]/g, '');

function hardScore(word) {
  const k = vkey(word);
  if (!k || k.length < 3) return 0;
  if (VOCAB.known[k]) return -99;                       // ban da bao la biet roi
  let s = 0;
  const syl = syllables(k);
  s += Math.max(0, syl - 1) * 1.3;                      // cang nhieu am tiet cang kho doc
  if (!EASY.has(k) && !EASY.has(k.replace(/(ies|es|s|ed|ing|ly)$/, ''))) s += 1.8;
  HARD_PAT.forEach(p => { if (p.test(k)) s += 1.1; });  // mau chinh ta de doc sai
  if (k.length >= 10) s += 0.8;
  s += Math.min(3, (VOCAB.miss[k] || 0) * 1.2);         // ban tung doc sai khi cham mic
  s += Math.min(1.6, (VOCAB.taps[k] || 0) * 0.5);       // ban tung mo ra tra nhieu lan
  return s;
}
const HARD_CUT = 3.4;
const isAutoHard = w => hardScore(w) >= HARD_CUT;

/* xep hang tu kho cua rieng bai dang mo */
function hardWordsOfDoc(limit) {
  if (!S.doc) return [];
  const seen = {};
  S.doc.paras.forEach(p => words(p.text).forEach(w => {
    const k = vkey(w);
    if (!k || STOP.has(k) || seen[k]) return;
    const sc = hardScore(w);
    if (sc >= HARD_CUT) seen[k] = { w: k, sc };
  }));
  return Object.values(seen).sort((a, b) => b.sc - a.sc).slice(0, limit || 30);
}

const PHRASES = Object.keys(GLOSS).filter(k => k.includes(' ')).sort((a, b) => b.length - a.length);
const apiCache = {};

function lookupLocal(key) {
  const k = key.toLowerCase();
  if (GLOSS[k]) return Object.assign({ src: 'glossary' }, GLOSS[k]);
  if (VOCAB.gloss[k] && VOCAB.gloss[k].vi) return Object.assign({ src: VOCAB.gloss[k].src || 'của bạn' }, VOCAB.gloss[k]);
  if (S.hard[k] && S.hard[k].vi) return { vi: S.hard[k].vi, src: 'của bạn' };
  const base = k.replace(/(ies)$/, 'y').replace(/(es|s|ed|ing)$/, '');
  if (GLOSS[base]) return Object.assign({ src: 'glossary' }, GLOSS[base]);
  if (VOCAB.gloss[base] && VOCAB.gloss[base].vi) return Object.assign({ src: VOCAB.gloss[base].src || 'của bạn' }, VOCAB.gloss[base]);
  return null;
}
/* Tra tu dong tu hai nguon mien phi, khong can key:
   - Wiktionary (Wikimedia): phien am IPA + dinh nghia tieng Anh ngan
   - MyMemory: nghia tieng Viet (dich may, chi de tham khao)
   Ket qua duoc cache vinh vien nen moi tu chi goi mang mot lan.      */
const AUTO = load('autodict', {});
function autoSave() {
  const keys = Object.keys(AUTO);
  if (keys.length > 2500) keys.slice(0, keys.length - 2000).forEach(k => delete AUTO[k]);
  save('autodict', AUTO);
}
async function fetchJSON(url, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 8000);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
function cleanWiki(s) {
  return String(s || '')
    .replace(/\{\{[^}]*\}\}/g, '')
    .replace(/\[\[([^\]|]*\|)?([^\]]*)\]\]/g, '$2')
    .replace(/'{2,}/g, '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
}
async function lookupWiktionary(word) {
  const u = 'https://en.wiktionary.org/w/api.php?action=query&prop=revisions&rvprop=content&rvslots=main'
    + '&titles=' + encodeURIComponent(word) + '&format=json&formatversion=2&origin=*';
  const j = await fetchJSON(u);
  const pg = ((j.query || {}).pages || [])[0];
  if (!pg || pg.missing || !pg.revisions) return null;
  const txt = pg.revisions[0].slots.main.content;
  const en = txt.split(/\n==[^=]/).find(s => /^=?English/.test(s)) || txt;
  const ipa = (en.match(/\{\{IPA\|en\|([^}|]*)/) || [])[1] || '';
  const hit = en.match(/^# ([^\n]{3,160})/m);
  const def = hit ? cleanWiki(hit[1]) : '';
  // tu loai lay tu tieu de gan nhat PHIA TREN dinh nghia, khong phai tieu de dau trang
  let pos = '';
  if (hit) {
    const before = en.slice(0, hit.index);
    const heads = [...before.matchAll(/\n=+\s*(Noun|Verb|Adjective|Adverb|Phrase|Idiom|Preposition|Interjection)\s*=+/g)];
    pos = heads.length ? heads[heads.length - 1][1] : '';
  }
  return (ipa || def) ? { ipa: ipa.trim(), def, pos } : null;
}
async function lookupViet(word) {
  const u = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=en%7Cvi';
  const j = await fetchJSON(u, 7000);
  const t = ((j.responseData || {}).translatedText || '').trim();
  if (!t || t.toLowerCase() === word.toLowerCase()) return '';
  return t;
}
async function lookupAuto(word) {
  const k = word.toLowerCase();
  if (AUTO[k] !== undefined) return AUTO[k];
  if (apiCache[k] !== undefined) return apiCache[k];
  const [w, v] = await Promise.all([
    lookupWiktionary(k).catch(() => null),
    lookupViet(k).catch(() => '')
  ]);
  const out = (w || v) ? { ipa: (w && w.ipa) || '', def: (w && w.def) || '', pos: (w && w.pos) || '', vi: v || '' } : null;
  apiCache[k] = out;
  if (out) { AUTO[k] = out; autoSave(); }
  return out;
}

      return;
    }
    if (!ipaBox.textContent) ipaBox.textContent = got.ipa || '';
    if (got.def) dfBox.textContent = (got.pos ? '(' + got.pos.toLowerCase() + ') ' : '') + got.def;
    if (!local && got.vi) {

      viBox.appendChild(warn);

  }
}

/* bien doan van thanh cac span co the bam tung tu / cum tu */
function tappable(text) {
  const frag = document.createDocumentFragment();
  let rest = text;
  const lower = text.toLowerCase();
  // tim cum tu trong glossary truoc
  const marks = [];
  PHRASES.forEach(ph => {
    let from = 0, at;
    while ((at = lower.indexOf(ph, from)) !== -1) {
      const okL = at === 0 || !/[a-z]/i.test(text[at - 1]);
      const okR = at + ph.length >= text.length || !/[a-z]/i.test(text[at + ph.length]);
      if (okL && okR && !marks.some(m => at < m.end && at + ph.length > m.start)) marks.push({ start: at, end: at + ph.length, ph });
      from = at + ph.length;
    }
  });
  marks.sort((a, b) => a.start - b.start);
  let pos = 0;
  const pushPlain = s => {
    s.split(/(\s+)/).forEach(tok => {
      if (!tok) return;
      if (/^\s+$/.test(tok)) { frag.appendChild(document.createTextNode(tok)); return; }
      const core = tok.replace(/^[^A-Za-z'’]+|[^A-Za-z'’]+$/g, '');
      if (!core) { frag.appendChild(document.createTextNode(tok)); return; }
      const key = core.toLowerCase();
      const cls = S.hard[key] ? ' hard'
        : lookupLocal(key) ? (isAutoHard(key) ? ' gl' : '')   // co nghia + may thay kho -> gach lien
        : isAutoHard(key) ? ' auto' : '';                      // may thay kho, chua co nghia -> net dut
      const sp = el('span', 'w' + cls, tok);
      sp.onclick = ev => { ev.stopPropagation(); showWord(sp, core); };
      frag.appendChild(sp);
    });
  };
  marks.forEach(m => {
    if (m.start > pos) pushPlain(text.slice(pos, m.start));
    const t = text.slice(m.start, m.end);
    const sp = el('span', 'w gl' + (S.hard[m.ph] ? ' hard' : ''), t);
    sp.onclick = ev => { ev.stopPropagation(); showWord(sp, t); };
    frag.appendChild(sp); pos = m.end;
  });
  if (pos < text.length) pushPlain(text.slice(pos));
  return frag;
}

let toastT = null;
function toast(msg) {
  const old = $('.toast'); if (old) old.remove();
  const t = el('div', 'toast', msg); document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}

    const dots = el('div', 'dots');
    (idx === -1 ? allSentIds() : sentIds(idx)).slice(0, 8).forEach(id => dots.appendChild(el('span', 'dot s' + mastery(id))));
    b.appendChild(dots);
    b.onclick = () => { S.sel = idx; TTS.stop(); render(); };
    return b;
  };
  list.appendChild(mkItem('Cả bài', -1));
  S.doc.paras.forEach((p, i) => list.appendChild(mkItem(keywords(p.text, 2).join(' / ') || ('Đoạn ' + (i + 1)), i)));
  r.appendChild(list);

  const auto = hardWordsOfDoc(24);
  const marked = Object.keys(S.hard);
  const noMeaning = auto.filter(x => !lookupLocal(x.w)).length;

  r.appendChild(el('h3', null, 'Từ khó của bài (' + auto.length + ')'));
  r.appendChild(el('p', 'hint', 'Máy chấm theo số âm tiết, độ hiếm, mẫu chính tả khó đọc — và theo chính lỗi của bạn khi chấm mic. Bấm một từ để xem nghĩa; trong đó có nút “Đã biết từ này” để loại bỏ vĩnh viễn.'));
  const wl = el('div', 'wordlist');
  marked.forEach(k => {
    const c = el('span', 'kw', k); c.style.cssText = 'cursor:pointer;background:var(--marker-soft);color:var(--warn)';
    c.title = 'Bạn tự đánh dấu';
    c.onclick = () => showWord(c, k);
    wl.appendChild(c);
  });
  auto.forEach(x => {
    if (S.hard[x.w]) return;
    const has = !!lookupLocal(x.w);
    const c = el('span', 'kw', x.w);
    c.style.cssText = 'cursor:pointer' + (has ? '' : ';background:transparent;border:1px dashed var(--fg-faint);color:var(--fg-dim)');
    c.title = (has ? 'Đã có nghĩa' : 'Chưa có nghĩa') + ' · điểm khó ' + x.sc.toFixed(1);
    c.onclick = () => showWord(c, x.w);
    wl.appendChild(c);
  });
  r.appendChild(wl);
  if (auto.length) {
    const row = el('div', 'row'); row.style.marginTop = '8px';
    const b = el('button', 'btn sm ghost', 'Đọc lần lượt');
    b.onclick = () => TTS.queue(auto.map(x => x.w), null, null);
    row.appendChild(b);
    if (noMeaning) {
      const b2 = el('button', 'btn sm', 'Tạo nghĩa cho cả bài (' + noMeaning + ')');
      b2.title = ASR.keyGet() ? 'Dùng OpenAI key đã lưu' : 'Cần nhập OpenAI key ở tab Đọc lại';
      b2.onclick = () => fillMeanings(auto.filter(x => !lookupLocal(x.w)).map(x => x.w));
      row.appendChild(b2);
    }
    r.appendChild(row);
  }
  const knownN = Object.keys(VOCAB.known).length;
  if (knownN) {
    const b3 = el('button', 'btn sm ghost', 'Đã biết: ' + knownN + ' từ');
    b3.style.marginTop = '6px';
    b3.title = 'Xem và bỏ đánh dấu';
    b3.onclick = () => { S.mode = 'stats'; render(); };
    r.appendChild(b3);
  }

  const lib = libList();
  if (lib.length > 1) {
    r.appendChild(el('h3', null, 'Bài đã lưu (' + lib.length + ')'));
    renderLibrary(r, true);
  }
}

      const bShow = el('button', 'btn sm', 'Hiện câu');
      const bSpeak = el('button', 'btn sm ghost', 'Nghe');
      bSpeak.onclick = () => TTS.say(s.t);
      const full = el('div', 'passage'); full.hidden = true; full.appendChild(tappable(s.t));
      bShow.onclick = () => { full.hidden = !full.hidden; bShow.textContent = full.hidden ? 'Hiện câu' : 'Ẩn câu'; };
      row.appendChild(bShow); row.appendChild(bSpeak);

    });

    const box = el('div', 'card');
    box.appendChild(el('h2', null, 'Xếp lại trật tự'));
    box.appendChild(scopeNote('Nhớ đúng thứ tự là phần khó nhất khi nói. Bấm mũi tên để xếp lại rồi kiểm tra.'));
    const order = sents.map((s, i) => i);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    const wrapSc = el('div', 'scramble');
    const draw = () => {
      wrapSc.innerHTML = '';
      order.forEach((si, pos) => {
        const row = el('div', 'sc');
        const h = el('div', 'h', String(pos + 1));
        const txt = el('div'); txt.style.flex = '1'; txt.style.minWidth = '0'; txt.textContent = sents[si].t;
        const up = el('button', 'btn sm ghost', '↑'); up.disabled = pos === 0;
        const dn = el('button', 'btn sm ghost', '↓'); dn.disabled = pos === order.length - 1;
        up.onclick = () => { [order[pos - 1], order[pos]] = [order[pos], order[pos - 1]]; draw(); };
        dn.onclick = () => { [order[pos + 1], order[pos]] = [order[pos], order[pos + 1]]; draw(); };
        row.appendChild(h); row.appendChild(txt); row.appendChild(up); row.appendChild(dn);
        wrapSc.appendChild(row);
      });
    };
    draw();
    box.appendChild(wrapSc);
    const bChk = el('button', 'btn primary', 'Kiểm tra thứ tự');
    bChk.style.marginTop = '10px';
    bChk.onclick = () => {
      const rows = wrapSc.querySelectorAll('.sc');
      let right = 0;
      order.forEach((si, pos) => {
        const good = si === pos;
        if (good) right++;
        rows[pos].classList.toggle('right', good);
        rows[pos].classList.toggle('wrong', !good);
      });
      toast('Đúng thứ tự: ' + right + '/' + order.length);
    };
    box.appendChild(bChk);
    v.appendChild(box);
  }
}

/* ----- MODE: So do (mindmap) -----
   Cay ngang: ten bai -> tung doan (tu khoa) -> tung cau.
   Dung de nho cau truc va thu tu y truoc khi hoc tung chu. */
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function wrapText(t, maxChars) {
  const out = []; let cur = '';
  t.split(/\s+/).forEach(w => {
    if (cur && (cur + ' ' + w).length > maxChars) { out.push(cur); cur = w; }
    else cur = cur ? cur + ' ' + w : w;
  });
  if (cur) out.push(cur);
  return out.slice(0, 6);
}
function mapLabel(t, how) {
  if (how === 'full') return t;
  if (how === 'letters') return firstLetterCue(t);
  return keywords(t, 3).join(' · ');
}

function viewMap(v) {
  if (!S.mapShow) S.mapShow = 'kw';
  const z = clamp(S.prefs.zoom || 1, 0.8, 1.8);

  const c = el('div', 'card');
  c.appendChild(el('h2', null, 'Sơ đồ bài'));
  c.appendChild(scopeNote('Trí nhớ bám vào cấu trúc: nhìn cả bài dưới dạng cây giúp bạn biết đoạn nào nối đoạn nào (chunking + serial order). Bấm vào một ô để nghe và chấm câu đó.'));
  const row = el('div', 'row'); row.style.marginTop = '12px';
  [['kw', 'Hiện từ khoá'], ['letters', 'Chữ cái đầu'], ['full', 'Cả câu']].forEach(([k, n]) => {
    const b = el('button', 'btn sm', n);
    b.setAttribute('aria-pressed', String(S.mapShow === k));
    b.onclick = () => { S.mapShow = k; render(); };
    row.appendChild(b);
  });
  const bAll = el('button', 'btn sm ghost', 'Nghe cả bài');
  bAll.onclick = () => TTS.queue(S.doc.paras.map(p => p.text), null, null);
  row.appendChild(bAll);
  c.appendChild(row);
  v.appendChild(c);

  /* --- do kich thuoc --- */
  const FSL = 14.5 * z, FSB = 15.5 * z, FSR = 18 * z;
  const pad = 10 * z, lineH = FSL * 1.4;
  const rootW = 150 * z, branchW = 200 * z;
  const gapX = 56 * z, gapY = 10 * z, groupGap = 22 * z;
  // o chua cau an theo be ngang con lai cua man hinh, khong de khung 760px cat mat chu
  const avail = Math.max(480, (v.clientWidth || 900) - 56);   // tru padding cua the
  const leafW = clamp(avail - rootW - branchW - gapX * 2 - 24, 240 * z, 760 * z);
  const x0 = 8, xb = x0 + rootW + gapX, xl = xb + branchW + gapX;
  const cpl = Math.floor(leafW / (FSL * 0.52)), cplB = Math.floor(branchW / (FSB * 0.52));

  const groups = S.doc.paras.map((p, pi) => {
    const leaves = p.sentences.map(s => {
      const id = 's' + pi + '.' + s.j;
      const lines = wrapText(mapLabel(s.t, S.mapShow), cpl);
      return { id, t: s.t, lines, h: lines.length * lineH + pad * 2 };
    });
    const bl = wrapText('Đoạn ' + (pi + 1) + ': ' + keywords(p.text, 3).join(' · '), cplB);
    return { pi, leaves, bLines: bl, bh: bl.length * (FSB * 1.4) + pad * 2 };
  });

  let y = 12;
  groups.forEach(g => {
    g.y0 = y;
    g.leaves.forEach(lf => { lf.y = y; y += lf.h + gapY; });
    g.y1 = y - gapY;
    g.by = (g.y0 + g.y1) / 2 - g.bh / 2;
    y += groupGap;
  });
  const H = Math.max(y + 10, 200), W = xl + leafW + 16;
  const rootH = 54 * z, rootY = H / 2 - rootH / 2;

  const box = el('div', 'card');
  const wrapSvg = el('div', 'mapwrap');
  const s = svgEl('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Sơ đồ cấu trúc bài' });
  wrapSvg.appendChild(s);

  const link = (x1, y1, x2, y2) => s.appendChild(svgEl('path', {
    class: 'maplink', d: 'M' + x1 + ',' + y1 + ' C' + (x1 + gapX * 0.6) + ',' + y1 + ' ' + (x2 - gapX * 0.6) + ',' + y2 + ' ' + x2 + ',' + y2
  }));

  const node = (x, yy, w, h, lines, fs, cls, onClick) => {
    const g = svgEl('g', { class: 'mapnode ' + cls, tabindex: '0' });
    g.appendChild(svgEl('rect', { x, y: yy, width: w, height: h, rx: 9 }));
    const t = svgEl('text', { x: x + pad, y: yy + pad + fs * 0.86, 'font-size': fs });
    lines.forEach((ln, i) => {
      const ts = svgEl('tspan', { x: x + pad, dy: i ? lineH : 0 });
      ts.textContent = ln; t.appendChild(ts);
    });
    g.appendChild(t);
    if (onClick) {
      g.addEventListener('click', onClick);
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(); } });
    }
    s.appendChild(g);
    return g;
  };

  groups.forEach(g => {
    link(x0 + rootW, rootY + rootH / 2, xb, g.by + g.bh / 2);
    g.leaves.forEach(lf => link(xb + branchW, g.by + g.bh / 2, xl, lf.y + lf.h / 2));
  });
  node(x0, rootY, rootW, rootH, wrapText(S.name || 'Bài học', Math.floor(rootW / (FSR * 0.52))), FSR, 'root',
    () => TTS.queue(S.doc.paras.map(p => p.text), null, null));
  groups.forEach(g => {
    node(xb, g.by, branchW, g.bh, g.bLines, FSB, 'branch', () => { S.sel = g.pi; TTS.say(S.doc.paras[g.pi].text); render(); });
    g.leaves.forEach(lf => node(xl, lf.y, leafW, lf.h, lf.lines, FSL, 'm' + mastery(lf.id), () => showMapSent(box, lf)));
  });

  box.appendChild(wrapSvg);
  const det = el('div'); det.id = 'mapdetail'; det.style.marginTop = '12px';
  box.appendChild(det);
  v.appendChild(box);

  const leg = el('p', 'hint');
  leg.textContent = 'Viền nét đứt: câu mới học · viền xanh lá: câu đã vững. Bấm “Chữ cái đầu” rồi tự đọc lại cả bài theo sơ đồ là bài kiểm tra tốt nhất.';
  v.appendChild(leg);
}

/* ----- MODE: Xoa dan (cloze fading) ----- */
function clozeHide(word, level, idx) {
  const l = word.toLowerCase();
  if (level >= 4) return true;
  if (STOP.has(l) || word.length < 4) return level >= 3 && idx % 2 === 0;
  return (idx * 7 + word.length) % 4 < level;
}
function viewCloze(v) {
  if (S.clozeLv == null) S.clozeLv = 1;
  const c = el('div', 'card');
  c.appendChild(el('h2', null, 'Xoá dần gợi ý'));
  c.appendChild(scopeNote('Tăng dần mức xoá: 1 → 4. Mỗi lần tự điền lại từ bị xoá là một lần truy xuất chủ động (active recall) — mạnh hơn đọc lại 10 lần. Bấm vào ô trống để kiểm tra.'));
  const row = el('div', 'row'); row.style.marginTop = '12px';
  [1, 2, 3, 4].forEach(L => {
    const b = el('button', 'btn sm', 'Mức ' + L);
    b.setAttribute('aria-pressed', String(S.clozeLv === L));
    b.onclick = () => { S.clozeLv = L; render(); };
    row.appendChild(b);
  });
  const bAll = el('button', 'btn sm ghost', 'Hiện tất cả');
  bAll.onclick = () => v.querySelectorAll('.blank').forEach(b => { b.textContent = b.dataset.w; b.classList.add('open'); });
  row.appendChild(bAll);
  const bSay = el('button', 'btn sm ghost', 'Nghe đáp án');
  bSay.onclick = () => TTS.say(selText());
  row.appendChild(bSay);
  c.appendChild(row);
  v.appendChild(c);

  const box = el('div', 'card');
  const pass = el('div', 'passage');
  let wi = 0;
  S.doc.paras.forEach((p, pi) => {
    if (S.sel !== -1 && S.sel !== pi) return;
    const par = el('p'); par.style.margin = '0 0 14px';
    p.sentences.forEach(s => {
      const parts = s.t.split(/([A-Za-zÀ-ɏ'’-]+)/);
      parts.forEach((tok, k) => {
        if (k % 2 === 0) { par.appendChild(document.createTextNode(tok)); return; }
        wi++;
        if (!clozeHide(tok, S.clozeLv, wi)) { par.appendChild(document.createTextNode(tok)); return; }
        const b = el('span', 'blank');
        b.dataset.w = tok;
        b.textContent = (S.clozeLv <= 2 ? tok[0] : '') + '·'.repeat(Math.min(tok.length - (S.clozeLv <= 2 ? 1 : 0), 7));
        b.onclick = () => { b.textContent = tok; b.classList.add('open'); };
        par.appendChild(b);
      });
      par.appendChild(document.createTextNode(' '));
    });
    pass.appendChild(par);
  });
  box.appendChild(pass);
  box.appendChild(gradeBar(sentsOfSel().map(s => s.id), () => render()));
  v.appendChild(box);
}

/* ----- Drill chung cho Go lai / On tap ----- */
function drill(v, ids, title, note) {
  if (!ids.length) {
    const c = el('div', 'card empty');

    v.appendChild(c); return;
  }
  const key = ids.join('|');
  if (S.drillKey !== key) { S.drillKey = key; S.drillI = 0; }   // doi doan/doi danh sach thi ve cau dau
  if (S.drillI == null || S.drillI < 0) S.drillI = 0;
  if (S.drillI >= ids.length) {                                  // da di het luot

/* ---------------- 8b. NHAN DANG GIONG NOI: 3 engine ----------------
   browser : Web Speech API (mien phi, nhanh, do chinh xac trung binh)
   openai  : gpt-4o-transcribe / whisper-1 qua API key cua nguoi dung
   whisper : Whisper chay ngay trong trinh duyet (transformers.js)      */
const ASR = {
  mr: null, stream: null, done: null, recording: false, opening: false, lastUrl: null,
  engine() { return S.prefs.asr || 'browser'; },
  keyGet() { try { return localStorage.getItem('aptis-recall:openai') || ''; } catch (e) { return ''; } },
  keySet(v) { try { v ? localStorage.setItem('aptis-recall:openai', v) : localStorage.removeItem('aptis-recall:openai'); } catch (e) {} },
  mime() {
    if (!window.MediaRecorder) return '';
    return ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus']
      .find(m => MediaRecorder.isTypeSupported(m)) || '';
  },
  /* Giu lai stream giua cac lan ghi: moi lan goi getUserMedia la mot lan
     trinh duyet hoi quyen (trang file:// khong nho quyen duoc). */
  async getStream() {
    if (this.stream && this.stream.active) return this.stream;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Trình duyệt không cho dùng micro ở trang này.');
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    return this.stream;
  },
  /* resolve ngay khi da bat dau ghi; ban ghi lay qua ASR.done */
  async start() {
    if (this.recording || this.opening) return false;
    this.opening = true;
    try {
      const stream = await this.getStream();
      const mt = this.mime();
      const mr = new MediaRecorder(stream, mt ? { mimeType: mt } : undefined);
      const chunks = [];
      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      this.done = new Promise(res => {
        mr.onstop = () => { this.recording = false; res(new Blob(chunks, { type: mt || 'audio/webm' })); };
      });
      mr.start(); this.mr = mr; this.recording = true;
      return true;
    } finally { this.opening = false; }
  },
  stop() { if (this.mr && this.recording) { try { this.mr.stop(); } catch (e) { this.recording = false; } } },
  release() {
    this.stop();
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
  }
};

async function transcribeOpenAI(blob) {
  const key = ASR.keyGet();
  if (!key) throw new Error('Chưa nhập API key của OpenAI.');
  const ext = blob.type.includes('mp4') ? 'mp4' : blob.type.includes('ogg') ? 'ogg' : 'webm';
  const fd = new FormData();
  fd.append('file', blob, 'speech.' + ext);
  fd.append('model', S.prefs.asrModel || 'gpt-4o-transcribe');
  fd.append('language', 'en');
  fd.append('response_format', 'json');
  const r = await fetch('https://api.openai.com/v1/audio/transcriptions', {
    method: 'POST', headers: { Authorization: 'Bearer ' + key }, body: fd
  });
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    if (r.status === 401) throw new Error('API key không hợp lệ hoặc đã bị thu hồi.');
    if (r.status === 429) throw new Error('Tài khoản OpenAI hết hạn mức hoặc gọi quá nhanh.');
    throw new Error('OpenAI trả lỗi ' + r.status + ': ' + t.slice(0, 150));
  }
  const j = await r.json();
  return (j.text || '').trim();
}

/* Whisper chay trong Web Worker: inference nang, de tren luong chinh
   se lam Chrome bao "Page Unresponsive" voi ban ghi dai. */
const WHISPER_WORKER_SRC = [
  "import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';",
  "env.allowLocalModels = false;",
  "let pipe = null, loaded = null;",
  "self.onmessage = async (e) => {",
  "  const m = e.data;",
  "  try {",
  "    if (!pipe || loaded !== m.model) {",
  "      loaded = m.model;",
  "      pipe = await pipeline('automatic-speech-recognition', m.model, { quantized: true,",
  "        progress_callback: p => { if (p && p.status === 'progress' && p.progress != null)",
  "          self.postMessage({ type: 'status', text: 'Đang tải mô hình: ' + Math.round(p.progress) + '%' }); } });",
  "    }",
  "    self.postMessage({ type: 'status', text: 'Đang nhận dạng trên máy…' });",
  "    const r = await pipe(m.audio, { language: 'english', task: 'transcribe', chunk_length_s: 30, stride_length_s: 5 });",
  "    self.postMessage({ type: 'done', text: (r && r.text) || '' });",
  "  } catch (err) { self.postMessage({ type: 'error', text: String((err && err.message) || err) }); }",
  "};"
].join('\n');

let waWorker = null, waWorkerBad = false;
function whisperWorker() {
  if (waWorkerBad) return null;
  if (waWorker) return waWorker;
  try {
    const url = URL.createObjectURL(new Blob([WHISPER_WORKER_SRC], { type: 'text/javascript' }));
    waWorker = new Worker(url, { type: 'module' });
    return waWorker;
  } catch (e) { waWorkerBad = true; return null; }
}
function whisperKill() {
  if (waWorker) { try { waWorker.terminate(); } catch (e) {} waWorker = null; }
}
function runInWorker(w, audio, model, onStatus) {
  return new Promise((res, rej) => {
    const cleanup = () => { w.removeEventListener('message', onMsg); w.removeEventListener('error', onErr); };
    const onMsg = e => {
      const m = e.data || {};
      if (m.type === 'status') { onStatus && onStatus(m.text); return; }
      cleanup();
      if (m.type === 'done') res(String(m.text || '').trim());
      else rej(new Error(m.text || 'Lỗi không rõ'));
    };
    const onErr = ev => { cleanup(); rej(new Error('WORKER_FAIL: ' + ((ev && ev.message) || 'không khởi động được worker'))); };
    w.addEventListener('message', onMsg); w.addEventListener('error', onErr);
    w.postMessage({ model, audio });   // khong transfer buffer de con dung lai khi phai chay o luong chinh
  });
}

let waPipe = null, waLoading = null;
async function whisperPipe(onStatus) {
  if (waPipe) return waPipe;
  if (!waLoading) waLoading = (async () => {
    onStatus && onStatus('Đang tải thư viện Whisper…');
    const mod = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
    mod.env.allowLocalModels = false;
    const name = S.prefs.whisperModel || 'Xenova/whisper-base.en';
    onStatus && onStatus('Đang tải mô hình ' + name.split('/')[1] + ' (chỉ lần đầu)…');
    waPipe = await mod.pipeline('automatic-speech-recognition', name, {
      quantized: true,
      progress_callback: p => {
        if (p && p.status === 'progress' && p.progress != null) onStatus && onStatus('Đang tải mô hình: ' + Math.round(p.progress) + '%');
      }
    });
    return waPipe;
  })().catch(e => { waLoading = null; throw e; });
  return waLoading;
}
async function blobToMono16k(blob) {
  const buf = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  const audio = await ac.decodeAudioData(buf);
  const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(audio.duration * 16000)), 16000);
  const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start();
  const out = await off.startRendering();
  ac.close();
  return out.getChannelData(0);
}
async function transcribeWhisper(blob, onStatus) {
  onStatus && onStatus('Đang chuẩn bị âm thanh…');
  const audio = await blobToMono16k(blob);
  const secs = Math.round(audio.length / 16000);
  const model = S.prefs.whisperModel || 'Xenova/whisper-base.en';
  const tag = ' (' + secs + ' giây ghi âm)';

  const w = whisperWorker();
  if (w) {
    try {
      return await runInWorker(w, audio, model, s => onStatus && onStatus(s + tag));
    } catch (e) {
      if (!/WORKER_FAIL/.test(e.message)) throw e;   // loi that su cua mo hinh -> bao len
      waWorkerBad = true; whisperKill();              // khong tao duoc worker -> chay o luong chinh
    }
  }
  onStatus && onStatus('Đang nhận dạng trên máy' + tag + ' — trang có thể đứng vài giây, đừng tắt.');
  await new Promise(r => setTimeout(r, 60));          // cho giao dien ve xong dong trang thai
  const pipe = await whisperPipe(onStatus);
  const r = await pipe(audio, { language: 'english', task: 'transcribe', chunk_length_s: 30, stride_length_s: 5 });
  return String((r && r.text) || '').trim();
}

    wrap.appendChild(el('p', 'hint', 'Chạy hoàn toàn trên máy bạn, không tốn tiền, không gửi tiếng nói đi đâu. Lần đầu cần tải mô hình (giữ lại trong cache trình duyệt), sau đó dùng được cả khi mất mạng.'));
    wrap.appendChild(el('p', 'hint sci', 'Tốc độ phụ thuộc CPU: khoảng 10–20 giây cho mỗi 30 giây ghi âm với base.en, chậm gấp 2–3 lần với small.en. Khi đọc cả bài (hơn một phút), nên dùng OpenAI API cho nhanh. Trong lúc nhận dạng có nút “Dừng nhận dạng” nếu bạn thấy lâu quá.'));
    host.appendChild(wrap);
  } else {
    host.appendChild(el('p', 'hint', 'Dùng sẵn bộ nhận dạng của Chrome/Edge: nhanh và miễn phí, nhưng hay nghe nhầm với câu dài hoặc giọng không phải bản ngữ. Nếu điểm thấp một cách vô lý, hãy đổi sang OpenAI API hoặc Whisper trên máy.'));
  }
}

function viewSpeak(v) {
  const c = el('div', 'card');
  c.appendChild(el('h2', null, 'Đọc lại & chấm điểm'));
  c.appendChild(scopeNote('Nói ra miệng là bước cuối: production practice. Máy nghe rồi so từng từ với bản gốc. Cần cho phép dùng micro.'));
  asrPanel(c);
  if (ASR.engine() === 'browser' && !SR.Ctor) c.appendChild(el('p', 'hint', 'Trình duyệt này không hỗ trợ nhận dạng giọng nói sẵn có. Hãy đổi sang OpenAI API hoặc Whisper trên máy.'));

  if (S.spScope == null) S.spScope = 'sent';
  const row = el('div', 'row'); row.style.marginTop = '12px';
  [['sent', 'Từng câu'], ['para', S.sel === -1 ? 'Từng đoạn' : 'Cả đoạn'], ['all', 'Cả bài']].forEach(([k, n]) => {
    const b = el('button', 'btn sm', n);
    b.setAttribute('aria-pressed', String(S.spScope === k));
    b.onclick = () => { S.spScope = k; S.spI = 0; render(); };
    row.appendChild(b);
  });
  c.appendChild(row);
  v.appendChild(c);

  let chunks;
  if (S.spScope === 'all') chunks = [{ ids: allSentIds(), t: S.doc.paras.map(p => p.text).join(' ') }];
  else if (S.spScope === 'para') chunks = S.doc.paras.map((p, pi) => ({ ids: sentIds(pi), t: p.text })).filter((x, i) => S.sel === -1 || S.sel === i);
  else chunks = sentsOfSel().map(s => ({ ids: [s.id], t: s.t }));
  if (!S.spI || S.spI >= chunks.length) S.spI = 0;
  const cur = chunks[S.spI];

  const box = el('div', 'card');
  const head = el('div', 'row');
  head.appendChild(el('h2', null, 'Phần ' + (S.spI + 1) + '/' + chunks.length));
  const bHear = el('button', 'btn sm ghost', 'Nghe mẫu');
  bHear.onclick = () => TTS.say(cur.t);
  head.appendChild(bHear);
  const bHide = el('button', 'btn sm ghost', 'Ẩn bản gốc');
  head.appendChild(bHide);
  box.appendChild(head);

  const src = el('div', 'passage'); src.style.marginTop = '10px'; src.appendChild(tappable(cur.t));
  bHide.onclick = () => { src.hidden = !src.hidden; bHide.textContent = src.hidden ? 'Hiện bản gốc' : 'Ẩn bản gốc'; };
  box.appendChild(src);

  const recRow = el('div', 'row'); recRow.style.marginTop = '12px';
  const bRec = el('button', 'btn primary', 'Bật micro & đọc');
  const bStop = el('button', 'btn', 'Dừng & chấm'); bStop.hidden = true;
  const bCancel = el('button', 'btn ghost', 'Huỷ'); bCancel.hidden = true;
  const led = el('span', 'rec'); led.appendChild(el('span', 'led')); led.appendChild(el('span', 'hint', 'chưa ghi'));
  recRow.appendChild(bRec); recRow.appendChild(bStop); recRow.appendChild(bCancel); recRow.appendChild(led);
  box.appendChild(recRow);
  if (ASR.stream) {
    const bOff = el('button', 'btn sm ghost', 'Tắt micro');
    bOff.title = 'Trả micro lại cho hệ thống (lần sau sẽ hỏi quyền lại)';
    bOff.onclick = () => { ASR.release(); render(); };
    recRow.appendChild(bOff);
  }

  const live = el('div', 'hint'); live.style.marginTop = '8px';
  const player = el('div'); player.style.marginTop = '8px';
  const out = el('div', 'resultbox');
  box.appendChild(live); box.appendChild(player); box.appendChild(out);

  const idle = () => {
    led.classList.remove('live'); led.lastChild.textContent = 'xong';
    bRec.textContent = 'Bật micro & đọc'; bRec.disabled = false; bRec.hidden = false;
    bStop.hidden = true; bCancel.hidden = true;
  };
  const recUI = () => {
    led.classList.add('live'); led.lastChild.textContent = 'đang ghi…';
    bRec.hidden = true; bStop.hidden = false; bCancel.hidden = false;
  };
  const showResult = txt => {
    out.innerHTML = '';
    if (!txt) { live.textContent = 'Không nghe được gì. Thử đọc to hơn hoặc kiểm tra micro.'; return; }
    live.textContent = 'Máy nghe được: “' + txt + '”';
    const d = diffWords(cur.t, txt);
    // tu bi doc thieu/sai -> ghi nhan lam tu kho cua rieng ban
    let newMiss = 0;
    d.parts.forEach(pt => {
      if (pt.k !== 'miss') return;
      const k = vkey(pt.w);
      if (!k || k.length < 3 || STOP.has(k) || VOCAB.known[k]) return;
      VOCAB.miss[k] = (VOCAB.miss[k] || 0) + 1; newMiss++;
    });
    if (newMiss) vocabSave();
    const sc = el('div', 'score');
    sc.appendChild(el('b', null, Math.round(d.acc * 100) + '%'));
    sc.appendChild(el('span', 'hint', 'so từng từ với bản gốc'));
    out.appendChild(sc);
    out.appendChild(renderDiff(d));
    if (S.spScope === 'all') S.stats.bestWhole = Math.max(S.stats.bestWhole || 0, Math.round(d.acc * 100));
    out.appendChild(gradeBar(cur.ids, () => { S.spI++; render(); }));
    persist();
  };

  let cancelled = false, aborted = false, phase = 'idle';
  bStop.onclick = () => {
    if (ASR.engine() === 'browser') { SR.stop(); return; }
    bStop.hidden = true; bCancel.hidden = true;
    led.classList.remove('live'); led.lastChild.textContent = 'đang xử lý';
    ASR.stop();
  };
  bCancel.onclick = () => {
    if (phase === 'proc') {                 // dang nhan dang -> giet worker
      aborted = true; phase = 'idle';
      whisperKill(); waPipe = null; waLoading = null;
      idle(); bCancel.textContent = 'Huỷ';
      live.textContent = 'Đã dừng nhận dạng. Bản ghi vẫn còn ở trình phát bên dưới.';
      return;
    }
    cancelled = true; phase = 'idle';
    if (ASR.engine() === 'browser') { SR.stop(); } else { ASR.stop(); }
    idle(); live.textContent = 'Đã huỷ bản ghi.';
  };

  bRec.onclick = async () => {
    const eng = ASR.engine();
    cancelled = false;

    if (eng === 'browser') {
      if (SR.live) { SR.stop(); return; }
      out.innerHTML = ''; live.textContent = '…';
      const ok = SR.start(
        txt => { live.textContent = txt || '…'; },
        txt => { const skip = cancelled; idle(); if (!skip) showResult(txt); }
      );
      if (ok) recUI();
      return;
    }

    if (ASR.recording || ASR.opening) return;  // chan bam nhieu lan khi dang xin quyen

    out.innerHTML = ''; player.innerHTML = '';
    live.textContent = ASR.stream ? 'Đang bật micro…' : 'Đang xin quyền dùng micro — hãy bấm “Cho phép”…';
    bRec.disabled = true;
    let blob;
    try {
      const started = await ASR.start();
      if (!started) { idle(); return; }
      recUI();
      live.textContent = 'Đang ghi âm, đọc to và rõ… Bấm “Dừng & chấm” khi xong.';
      blob = await ASR.done;
    } catch (e) {
      idle();
      live.textContent = /denied|not allowed/i.test(e.message || '')
        ? 'Bạn đã từ chối quyền micro. Bấm vào biểu tượng ổ khoá/micro trên thanh địa chỉ để cho phép lại.'
        : 'Không mở được micro: ' + e.message;
      return;
    }
    if (cancelled) { idle(); return; }
    if (ASR.lastUrl) URL.revokeObjectURL(ASR.lastUrl);
    ASR.lastUrl = URL.createObjectURL(blob);
    const au = document.createElement('audio');
    au.controls = true; au.src = ASR.lastUrl; au.style.width = '100%';
    player.appendChild(au);

    phase = 'proc'; aborted = false;
    bRec.hidden = false; bStop.hidden = true;
    bRec.disabled = true; bRec.textContent = 'Đang chấm…';
    led.classList.remove('live'); led.lastChild.textContent = 'đang xử lý';
    if (eng === 'whisper') { bCancel.hidden = false; bCancel.textContent = 'Dừng nhận dạng'; }
    let note = eng === 'openai' ? 'Đang gửi bản ghi tới OpenAI…' : 'Đang chuẩn bị…';
    const t0 = Date.now();
    const tick = setInterval(() => { live.textContent = note + '  ' + Math.round((Date.now() - t0) / 1000) + 's'; }, 500);
    try {
      const txt = eng === 'openai'
        ? await transcribeOpenAI(blob)
        : await transcribeWhisper(blob, s => { note = s; });
      if (aborted) return;
      phase = 'idle'; idle(); bCancel.textContent = 'Huỷ'; showResult(txt);
    } catch (e) {
      if (aborted) return;
      phase = 'idle'; idle(); bCancel.textContent = 'Huỷ';
      live.textContent = 'Lỗi nhận dạng: ' + e.message;
    } finally { clearInterval(tick); }
  };

  const nav = el('div', 'row'); nav.style.marginTop = '12px';
  const bPrev = el('button', 'btn sm ghost', 'Phần trước'); bPrev.disabled = S.spI === 0;
  const bNext = el('button', 'btn sm ghost', 'Phần sau'); bNext.disabled = S.spI >= chunks.length - 1;
  bPrev.onclick = () => { S.spI--; render(); };
  bNext.onclick = () => { S.spI++; render(); };
  nav.appendChild(bPrev); nav.appendChild(bNext);
  box.appendChild(nav);
  v.appendChild(box);
}

      }).join('\n');

  const b2 = el('button', 'btn ghost', 'Xoá danh sách từ khó');

  row.appendChild(b1); row.appendChild(b2);
